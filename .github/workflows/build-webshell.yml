# 无本地 Mac 时：用 GitHub Actions 云端 Mac 编译 ObjC WebShell
# 使用方法：仓库 → Actions → Build ObjC WebShell → Run workflow
name: Build ObjC WebShell

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-app/tools/native_objc/**"
      - ".github/workflows/build-webshell.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile ObjC WebShell + dylib
        run: |
          set -euo pipefail
          chmod +x ios-app/tools/native_objc/build_on_mac.sh
          ios-app/tools/native_objc/build_on_mac.sh
          file ios-app/tools/cache/WebShell ios-app/tools/cache/WebShell.dylib
          ls -la ios-app/tools/cache/WebShell ios-app/tools/cache/WebShell.dylib
          otool -L ios-app/tools/cache/WebShell.dylib | tee /tmp/libs.txt
          if grep -q libswift /tmp/libs.txt; then
            echo "ERROR: Swift runtime leaked into dylib"
            exit 1
          fi

      - name: Upload WebShell artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WebShell
          path: |
            ios-app/tools/cache/WebShell
            ios-app/tools/cache/WebShell.dylib
          if-no-files-found: error
          retention-days: 14
